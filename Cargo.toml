[package]
name = "rustclaw"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
json_comments = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
webpki-roots = "1"
